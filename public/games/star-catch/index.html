<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>별 받기</title>
    <meta name="description" content="떨어지는 별을 받고 폭탄은 피하는 미니게임" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Nanum+Pen+Script&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      :root {
        --paper: #efe8db;
        --paper-2: #e3d9c6;
        --ink: #16130e;
        --ink-soft: #6a6154;
        --accent: #c8401d;
      }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: 'Caveat', 'Nanum Pen Script', cursive;
        font-size: 20px;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #stage { position: fixed; inset: 0; display: grid; place-items: center; touch-action: none; }
      canvas { display: block; }

      .back {
        position: fixed;
        top: max(14px, env(safe-area-inset-top));
        left: max(14px, env(safe-area-inset-left));
        z-index: 10;
        color: var(--ink-soft);
        text-decoration: none;
        padding: 0.1rem 0.2rem;
      }
      .back:hover { color: var(--accent); }

      .overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 0.35rem;
        text-align: center;
        padding: 1.5rem;
        background: color-mix(in srgb, var(--paper) 88%, transparent);
      }
      .overlay[hidden] { display: none; }
      .overlay h1 {
        font-size: clamp(2.2rem, 11vw, 3.4rem);
        margin: 0 0 0.3rem;
        letter-spacing: -0.02em;
        transform: rotate(-1.6deg);
      }
      .overlay p { margin: 0; color: var(--ink-soft); line-height: 1.55; }
      .overlay .big {
        font-size: clamp(3.2rem, 18vw, 4.6rem);
        line-height: 1;
        color: var(--accent);
        margin: 0.2rem 0 0.4rem;
        transform: rotate(1.2deg);
      }

      button {
        position: relative;
        margin-top: 1.4rem;
        font: inherit;
        font-size: 1.25rem;
        color: var(--ink);
        background: none;
        border: 0;
        padding: 0.5rem 2.4rem;
        cursor: pointer;
        transform: rotate(-0.8deg);
      }
      button::before {
        content: '';
        position: absolute;
        inset: 0;
        border: 2px solid var(--ink);
        filter: url(#wobble);
      }
      button:hover { color: var(--accent); }
      button:hover::before { border-color: var(--accent); }
      button:active { transform: rotate(-0.8deg) translateY(2px); }
    </style>
  </head>
  <body>
    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
      <filter id="wobble" x="-15%" y="-60%" width="130%" height="220%">
        <feTurbulence type="fractalNoise" baseFrequency="0.013 0.021" numOctaves="3" seed="9" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="4.2" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <a class="back" href="/games/">← 게임 목록</a>
    <div id="stage">
      <canvas id="c"></canvas>
      <div class="overlay" id="ov">
        <h1 id="ov-title">별 받기</h1>
        <div class="big" id="ov-score" hidden></div>
        <p id="ov-text">떨어지는 별을 받고<br />까만 폭탄은 피하세요.<br /><br />← → 키 또는 화면을 손가락으로 쓸기</p>
        <button id="ov-btn">시작</button>
      </div>
    </div>

    <script>
      (() => {
        'use strict';

        // ── 색 ──────────────────────────────────────────
        const C = {
          paper: '#efe8db',
          paper2: '#e0d5c0',
          ink: '#16130e',
          inkSoft: '#6a6154',
          faint: '#c3b8a2',
          accent: '#c8401d',
        };

        // ── 가상 좌표계 (실제 화면 크기와 무관하게 이 안에서 계산) ──
        const W = 360;
        const H = 620;

        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const stage = document.getElementById('stage');
        const ov = document.getElementById('ov');
        const ovTitle = document.getElementById('ov-title');
        const ovText = document.getElementById('ov-text');
        const ovScore = document.getElementById('ov-score');
        const ovBtn = document.getElementById('ov-btn');

        let scale = 1;

        function resize() {
          const vw = stage.clientWidth;
          const vh = stage.clientHeight;
          scale = Math.min(vw / W, vh / H);
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.style.width = W * scale + 'px';
          canvas.style.height = H * scale + 'px';
          canvas.width = Math.round(W * scale * dpr);
          canvas.height = Math.round(H * scale * dpr);
          ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
        }
        window.addEventListener('resize', resize);

        // ── 상태 ──────────────────────────────────────────
        const BEST_KEY = 'star-catch-best';
        let state = 'ready';
        let score = 0;
        let lives = 3;
        let elapsed = 0;
        let spawnTimer = 0;
        let shake = 0;
        let items = [];
        let bits = [];
        let best = Number(localStorage.getItem(BEST_KEY) || 0);

        const player = { x: W / 2, target: W / 2, w: 62, y: H - 74, hurt: 0, blink: 0 };
        const keys = { left: false, right: false };

        // 배경 잉크 점
        const specks = Array.from({ length: 40 }, (_, i) => ({
          x: (i * 97.3) % W,
          y: (i * 151.7) % H,
          r: 0.7 + ((i * 37) % 10) / 11,
          p: (i * 0.37) % 1,
        }));

        function reset() {
          score = 0; lives = 3; elapsed = 0; spawnTimer = 0; shake = 0;
          items = []; bits = [];
          player.x = player.target = W / 2;
          player.hurt = 0;
        }

        function start() { reset(); state = 'playing'; ov.hidden = true; }

        function gameOver() {
          state = 'over';
          if (score > best) {
            best = score;
            try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
          }
          ovTitle.textContent = '게임 끝';
          ovScore.hidden = false;
          ovScore.textContent = score;
          ovText.innerHTML = '최고 기록 ' + best + '점';
          ovBtn.textContent = '다시 하기';
          ov.hidden = false;
        }

        // ── 입력 ──────────────────────────────────────────
        addEventListener('keydown', (e) => {
          if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
          if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
          if ((e.key === ' ' || e.key === 'Enter') && state !== 'playing') { e.preventDefault(); start(); }
          if (e.key.startsWith('Arrow')) e.preventDefault();
        });
        addEventListener('keyup', (e) => {
          if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
          if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        });

        function pointAt(clientX) {
          const rect = canvas.getBoundingClientRect();
          player.target = Math.max(player.w / 2, Math.min(W - player.w / 2, (clientX - rect.left) / scale));
        }
        let dragging = false;
        stage.addEventListener('pointerdown', (e) => { dragging = true; pointAt(e.clientX); });
        stage.addEventListener('pointermove', (e) => { if (dragging) pointAt(e.clientX); });
        addEventListener('pointerup', () => { dragging = false; });
        addEventListener('pointercancel', () => { dragging = false; });

        ovBtn.addEventListener('click', (e) => { e.stopPropagation(); start(); });

        // ── 스폰 ──────────────────────────────────────────
        function spawn() {
          const t = elapsed / 1000;
          const bombChance = Math.min(0.14 + t * 0.008, 0.34);
          const r = Math.random();
          let type = 'star';
          if (r < bombChance) type = 'bomb';
          else if (r > 0.94) type = 'big';
          items.push({
            x: 24 + Math.random() * (W - 48),
            y: -24,
            vy: (110 + Math.random() * 55 + t * 6) * (type === 'bomb' ? 1.06 : 1),
            rot: Math.random() * Math.PI,
            spin: (Math.random() - 0.5) * 3,
            type,
            r: type === 'big' ? 16 : 12,
          });
        }

        function burst(x, y, color, n) {
          for (let i = 0; i < n; i++) {
            const a = Math.random() * Math.PI * 2;
            const s = 40 + Math.random() * 130;
            bits.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: 0.5 + Math.random() * 0.4, max: 0.9, color });
          }
        }

        // ── 갱신 ──────────────────────────────────────────
        function update(dt) {
          if (state !== 'playing') return;
          elapsed += dt * 1000;

          if (keys.left) player.target -= 420 * dt;
          if (keys.right) player.target += 420 * dt;
          player.target = Math.max(player.w / 2, Math.min(W - player.w / 2, player.target));
          player.x += (player.target - player.x) * Math.min(1, dt * 16);

          if (player.hurt > 0) player.hurt -= dt;
          player.blink = (player.blink + dt) % 3.4;

          const interval = Math.max(0.32, 0.95 - elapsed / 22000);
          spawnTimer += dt;
          while (spawnTimer >= interval) { spawnTimer -= interval; spawn(); }

          const py = player.y;
          for (let i = items.length - 1; i >= 0; i--) {
            const it = items[i];
            it.y += it.vy * dt;
            it.rot += it.spin * dt;

            const caught =
              it.y + it.r > py - 6 &&
              it.y - it.r < py + 20 &&
              Math.abs(it.x - player.x) < player.w / 2 + it.r * 0.5;

            if (caught) {
              items.splice(i, 1);
              if (it.type === 'bomb') {
                lives--;
                player.hurt = 0.55;
                shake = 12;
                burst(it.x, py - 8, C.ink, 16);
                if (lives <= 0) { gameOver(); return; }
              } else {
                score += it.type === 'big' ? 5 : 1;
                burst(it.x, py - 8, it.type === 'big' ? C.accent : C.inkSoft, it.type === 'big' ? 18 : 9);
              }
              continue;
            }

            if (it.y - it.r > H + 20) {
              items.splice(i, 1);
              if (it.type !== 'bomb') {
                lives--;
                shake = 6;
                if (lives <= 0) { gameOver(); return; }
              }
            }
          }

          for (let i = bits.length - 1; i >= 0; i--) {
            const b = bits[i];
            b.life -= dt;
            if (b.life <= 0) { bits.splice(i, 1); continue; }
            b.x += b.vx * dt;
            b.y += b.vy * dt;
            b.vy += 320 * dt;
          }

          if (shake > 0) shake = Math.max(0, shake - dt * 48);
        }

        // ── 그리기 ────────────────────────────────────────
        function starPath(g, r) {
          g.beginPath();
          for (let i = 0; i < 10; i++) {
            const rad = i % 2 === 0 ? r : r * 0.44;
            const a = (Math.PI / 5) * i - Math.PI / 2;
            const x = Math.cos(a) * rad;
            const y = Math.sin(a) * rad;
            i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
          }
          g.closePath();
        }

        function drawPlayer() {
          const x = player.x;
          const y = player.y;
          const hurt = player.hurt > 0 && Math.floor(player.hurt * 14) % 2 === 0;
          ctx.save();
          ctx.translate(x, y);
          ctx.lineJoin = 'round';

          // 바닥 그림자 (해칭 한 줄)
          ctx.strokeStyle = C.faint;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-26, 34);
          ctx.lineTo(26, 34);
          ctx.stroke();

          const line = hurt ? C.accent : C.ink;
          ctx.strokeStyle = line;
          ctx.fillStyle = C.paper;
          ctx.lineWidth = 2.6;

          // 귀
          for (const s of [-1, 1]) {
            ctx.beginPath();
            ctx.moveTo(s * 17, -12);
            ctx.lineTo(s * 26, -34);
            ctx.lineTo(s * 6, -20);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }

          // 몸통
          ctx.beginPath();
          ctx.moveTo(-player.w / 2, 4);
          ctx.quadraticCurveTo(-player.w / 2, -22, 0, -22);
          ctx.quadraticCurveTo(player.w / 2, -22, player.w / 2, 4);
          ctx.quadraticCurveTo(player.w / 2, 30, 0, 30);
          ctx.quadraticCurveTo(-player.w / 2, 30, -player.w / 2, 4);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // 배 (받는 부분) — 해칭
          ctx.strokeStyle = C.faint;
          ctx.lineWidth = 1.6;
          for (let i = -1; i <= 1; i++) {
            ctx.beginPath();
            ctx.moveTo(-18 + i * 3, 8 + i * 5);
            ctx.lineTo(18 + i * 3, 4 + i * 5);
            ctx.stroke();
          }

          // 눈
          const blinking = player.blink > 3.2;
          ctx.strokeStyle = C.ink;
          ctx.fillStyle = C.ink;
          ctx.lineWidth = 2.4;
          if (blinking) {
            for (const s of [-1, 1]) {
              ctx.beginPath();
              ctx.moveTo(s * 10 - 5, -6);
              ctx.lineTo(s * 10 + 5, -6);
              ctx.stroke();
            }
          } else {
            for (const s of [-1, 1]) {
              ctx.beginPath();
              ctx.ellipse(s * 10, -6, 3.4, 4.6, 0, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          ctx.restore();
        }

        function draw() {
          const t = performance.now() / 1000;
          ctx.save();
          if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

          // 종이
          ctx.fillStyle = C.paper;
          ctx.fillRect(-20, -20, W + 40, H + 40);

          // 흐린 잉크 점
          for (const s of specks) {
            ctx.globalAlpha = 0.18 + 0.3 * Math.abs(Math.sin(t * 0.7 + s.p * 6.28));
            ctx.fillStyle = C.faint;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;

          // 바닥선
          ctx.strokeStyle = C.faint;
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.moveTo(0, H - 34);
          ctx.lineTo(W, H - 34);
          ctx.stroke();

          // 떨어지는 것들
          ctx.lineJoin = 'round';
          for (const it of items) {
            ctx.save();
            ctx.translate(it.x, it.y);
            ctx.rotate(it.rot);
            if (it.type === 'bomb') {
              // 까만 덩어리 — 별과 확실히 구분
              ctx.fillStyle = C.ink;
              ctx.beginPath();
              ctx.arc(0, 0, it.r, 0, Math.PI * 2);
              ctx.fill();
              ctx.strokeStyle = C.ink;
              ctx.lineWidth = 2.4;
              ctx.beginPath();
              ctx.moveTo(4, -it.r + 1);
              ctx.quadraticCurveTo(13, -it.r - 7, 8, -it.r - 14);
              ctx.stroke();
            } else if (it.type === 'big') {
              ctx.fillStyle = C.accent;
              ctx.strokeStyle = C.accent;
              ctx.lineWidth = 2.4;
              starPath(ctx, it.r);
              ctx.fill();
              ctx.stroke();
            } else {
              ctx.strokeStyle = C.ink;
              ctx.fillStyle = C.paper;
              ctx.lineWidth = 2.4;
              starPath(ctx, it.r);
              ctx.fill();
              ctx.stroke();
            }
            ctx.restore();
          }

          // 파티클
          for (const b of bits) {
            ctx.globalAlpha = Math.max(0, b.life / b.max);
            ctx.fillStyle = b.color;
            ctx.beginPath();
            ctx.arc(b.x, b.y, 2.4, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;

          drawPlayer();

          // 점수판
          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';
          ctx.fillStyle = C.inkSoft;
          ctx.font = "400 15px Caveat, 'Nanum Pen Script', cursive";
          ctx.fillText('점수', 18, 32);
          ctx.fillStyle = C.ink;
          ctx.font = "700 34px Caveat, 'Nanum Pen Script', cursive";
          ctx.fillText(String(score), 18, 46);

          // 목숨
          ctx.textAlign = 'right';
          for (let i = 0; i < 3; i++) {
            ctx.save();
            ctx.translate(W - 20 - i * 24, 54);
            ctx.strokeStyle = C.accent;
            ctx.fillStyle = C.accent;
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.moveTo(0, 4);
            ctx.bezierCurveTo(-9, -6, -2, -12, 0, -5);
            ctx.bezierCurveTo(2, -12, 9, -6, 0, 4);
            ctx.closePath();
            i < lives ? ctx.fill() : ctx.stroke();
            ctx.restore();
          }

          if (best > 0 && state === 'playing') {
            ctx.fillStyle = C.faint;
            ctx.font = "400 15px Caveat, 'Nanum Pen Script', cursive";
            ctx.textAlign = 'right';
            ctx.fillText('최고 ' + best, W - 18, 32);
          }

          ctx.restore();
        }

        // ── 루프 ──────────────────────────────────────────
        let last = performance.now();
        function frame(now) {
          const dt = Math.min((now - last) / 1000, 0.05);
          last = now;
          update(dt);
          draw();
          requestAnimationFrame(frame);
        }

        resize();
        if (best > 0) ovText.innerHTML += '<br><br>최고 기록 ' + best + '점';
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
